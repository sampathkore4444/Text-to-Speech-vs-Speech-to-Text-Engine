[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-speech-ai"
version = "0.1.0"
description = "Production-grade speech AI platform (STT + TTS) for banking: ASR with VAD, PII redaction, streaming, batch jobs, evaluation (WER/CER/RTF/latency) and observability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bank Speech AI Team" }]
keywords = ["speech", "asr", "stt", "tts", "whisper", "piper", "banking", "redaction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "jiwer>=3.0",
    "prometheus-client>=0.20",
    "rich>=13.7",
    "num2words>=0.5.12",
    "python-multipart>=0.0.9",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local on-premise inference backends. Installed by default in the Docker image.
engines = [
    "faster-whisper>=1.0",
    "piper-tts>=1.2",
    "webrtcvad-wheels>=2.0.12",
    "soxr>=0.3.7",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
# LoRA fine-tuning stack (PyTorch Whisper). Install CPU torch separately on
# Windows: pip install torch --index-url https://download.pytorch.org/whl/cpu
# transformers is pinned <5: the whisper LoRA recipe (PEFT seq2seq wrapper)
# is tested against 4.x, and 5.x changed the Whisper forward signature.
finetune = [
    "torch>=2.1",
    "transformers>=4.44,<5",
    "peft>=0.10",
    "accelerate>=0.30",
    "safetensors>=0.4",
]

[project.scripts]
speechai = "speechai.cli.main:main"
speechai-finetune = "speechai.finetune.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function calls in default args (Depends)
extend-ignore = ["E501"]  # long lines acceptable in this codebase (max ~110)

[tool.ruff.lint.per-file-ignores]
"src/speechai/api/*.py" = ["B008"]
"tests/*.py" = ["B011"]
